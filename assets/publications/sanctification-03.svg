<text x="540" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="91" font-weight="bold" letter-spacing="-2" fill="#241B14">DIEU VEUT</text><text x="540" y="592" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="91" font-weight="bold" letter-spacing="-2" fill="#241B14">RENOUVELER</text><text x="540" y="704" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="91" font-weight="bold" letter-spacing="-2" fill="#241B14">TES PENSÉES</text>
